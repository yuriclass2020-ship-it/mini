<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>노리랩 AI 동화</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { font-family:'Noto Sans KR',sans-serif; background:#1a1a2e; min-height:100vh; overflow:hidden; user-select:none; }

    /* ── HOME ── */
    #home {
      min-height:100vh;
      background: linear-gradient(160deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
      display:flex; flex-direction:column; align-items:center;
      padding:24px 16px 32px;
      overflow-y:auto;
    }
    .home-title {
      text-align:center; margin-bottom:28px; margin-top:8px;
    }
    .home-title .badge {
      display:inline-block;
      background:rgba(255,255,255,.1);
      border:1px solid rgba(255,255,255,.2);
      color:rgba(255,255,255,.7);
      font-size:11px; font-weight:700; letter-spacing:.15em;
      padding:4px 14px; border-radius:20px;
      margin-bottom:10px;
    }
    .home-title h1 {
      font-size:28px; font-weight:900; color:#fff;
      line-height:1.2;
    }
    .home-title h1 span { color:#FFD166; }
    .home-title p {
      font-size:13px; color:rgba(255,255,255,.5);
      margin-top:6px; font-weight:400;
    }

    /* floating stars background */
    .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
    .star {
      position:absolute; background:#fff; border-radius:50%;
      animation: twinkle 3s infinite;
    }
    @keyframes twinkle { 0%,100%{opacity:.2;transform:scale(1)} 50%{opacity:.8;transform:scale(1.3)} }

    .weeks-grid {
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap:14px;
      width:100%; max-width:500px;
      position:relative; z-index:1;
    }

    .week-card {
      border-radius:20px;
      padding:18px 14px;
      cursor:pointer;
      transition: transform .2s, box-shadow .2s;
      display:flex; flex-direction:column; align-items:center; gap:8px;
      border:2px solid rgba(255,255,255,.15);
      position:relative; overflow:hidden;
    }
    .week-card::before {
      content:''; position:absolute; inset:0;
      background:rgba(255,255,255,.08);
      opacity:0; transition:opacity .2s;
    }
    .week-card:hover::before, .week-card:active::before { opacity:1; }
    .week-card:active { transform:scale(.97); }

    .week-card .wk-emoji { font-size:36px; line-height:1; }
    .week-card .wk-num { font-size:10px; font-weight:700; letter-spacing:.1em; color:rgba(255,255,255,.6); }
    .week-card .wk-title { font-size:13px; font-weight:700; color:#fff; text-align:center; line-height:1.3; }

    /* ── STORY SCREEN ── */
    #story {
      display:none;
      position:fixed; inset:0;
      flex-direction:column;
      transition:background .5s;
    }
    #story.show { display:flex; }

    .story-top {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 18px;
      position:relative; z-index:10;
    }
    .back-btn {
      width:40px; height:40px;
      background:rgba(255,255,255,.2);
      border:none; border-radius:50%;
      color:#fff; font-size:20px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      backdrop-filter:blur(8px);
      transition:background .2s;
    }
    .back-btn:hover { background:rgba(255,255,255,.3); }

    .page-dots { display:flex; gap:6px; }
    .dot {
      width:8px; height:8px; border-radius:50%;
      background:rgba(255,255,255,.3);
      transition:all .3s;
    }
    .dot.active { background:#fff; width:20px; border-radius:4px; }

    .audio-btn {
      width:40px; height:40px;
      background:rgba(255,255,255,.2);
      border:none; border-radius:50%;
      color:#fff; font-size:18px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      backdrop-filter:blur(8px);
      transition:all .2s;
    }
    .audio-btn:hover { background:rgba(255,255,255,.3); }
    .audio-btn.playing { background:rgba(255,255,255,.4); animation:pulse-btn 1.5s infinite; }
    @keyframes pulse-btn { 0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.4)} 50%{box-shadow:0 0 0 10px rgba(255,255,255,0)} }

    /* Scene area */
    .scene-area {
      flex:1; display:flex; align-items:center; justify-content:center;
      position:relative; overflow:hidden;
    }
    .scene-svg { width:100%; max-width:320px; max-height:260px; }

    /* Text area */
    .text-area {
      background:rgba(255,255,255,.15);
      backdrop-filter:blur(20px);
      border-top:1px solid rgba(255,255,255,.2);
      padding:22px 22px 14px;
      min-height:160px;
      display:flex; flex-direction:column; gap:14px;
    }
    .story-week-label {
      font-size:10px; font-weight:700; letter-spacing:.12em;
      color:rgba(255,255,255,.5); text-transform:uppercase;
    }
    .story-text {
      font-size:18px; font-weight:700; color:#fff;
      line-height:1.65;
      flex:1;
      min-height:80px;
    }
    .story-text.animating span { opacity:0; animation:wordIn .3s forwards; }
    @keyframes wordIn { to{opacity:1} }

    .story-nav {
      display:flex; align-items:center; justify-content:space-between;
    }
    .nav-hint { font-size:11px; color:rgba(255,255,255,.4); font-weight:400; }
    .next-btn {
      padding:10px 22px;
      background:#fff;
      border:none; border-radius:24px;
      font-family:'Noto Sans KR',sans-serif;
      font-size:13px; font-weight:700;
      cursor:pointer;
      transition:all .2s;
      display:flex; align-items:center; gap:6px;
    }
    .next-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.2); }
    .next-btn:active { transform:scale(.97); }

    /* Completion screen */
    .complete-screen {
      display:none;
      position:fixed; inset:0;
      background:linear-gradient(135deg,#667eea,#764ba2);
      flex-direction:column; align-items:center; justify-content:center;
      z-index:100; gap:20px;
      text-align:center; padding:30px;
    }
    .complete-screen.show { display:flex; }
    .complete-emoji { font-size:80px; animation:bounce 1s infinite alternate; }
    @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-16px)} }
    .complete-msg { font-size:24px; font-weight:900; color:#fff; line-height:1.3; }
    .complete-sub { font-size:15px; color:rgba(255,255,255,.7); font-weight:400; }
    .home-again-btn {
      margin-top:10px;
      padding:14px 36px;
      background:#FFD166;
      border:none; border-radius:30px;
      font-family:'Noto Sans KR',sans-serif;
      font-size:16px; font-weight:700;
      color:#333; cursor:pointer;
      transition:all .2s;
    }
    .home-again-btn:hover { transform:scale(1.04); }

    /* Animations for characters */
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes spin-slow { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes wiggle { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }
    @keyframes pop { 0%{transform:scale(0);opacity:0} 80%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
    @keyframes slide-in { from{transform:translateX(-60px);opacity:0} to{transform:translateX(0);opacity:1} }
    @keyframes blink { 0%,90%,100%{scaleY:1} 95%{scaleY:.1} }

    .float { animation:float 2.5s ease-in-out infinite; }
    .wiggle { animation:wiggle 1s ease-in-out infinite; }
    .spin-slow { animation:spin-slow 8s linear infinite; }

    @media (max-width:400px) {
      .story-text { font-size:16px; }
      .weeks-grid { gap:10px; }
      .week-card { padding:14px 10px; }
    }
  </style>
</head>
<body>

<!-- STARS BG -->
<div class="stars" id="stars"></div>

<!-- ══ HOME ══ -->
<div id="home">
  <div class="home-title" style="position:relative;z-index:1">
    <div class="badge">NORILAB · 노리랩</div>
    <h1>AI <span>동화</span> 극장 🌟</h1>
    <p>주차를 선택하면 동화가 시작돼요!</p>
  </div>
  <div class="weeks-grid" id="weeks-grid"></div>
</div>

<!-- ══ STORY ══ -->
<div id="story">
  <div class="story-top">
    <button class="back-btn" onclick="goHome()">←</button>
    <div class="page-dots" id="page-dots"></div>
    <button class="audio-btn" id="audio-btn" onclick="toggleAudio()">🔊</button>
  </div>
  <div class="scene-area" id="scene-area"></div>
  <div class="text-area">
    <div class="story-week-label" id="story-week-label"></div>
    <div class="story-text" id="story-text"></div>
    <div class="story-nav">
      <span class="nav-hint" id="nav-hint">탭하면 다음 장면</span>
      <button class="next-btn" id="next-btn" onclick="nextPage()">
        다음 <span>→</span>
      </button>
    </div>
  </div>
</div>

<!-- ══ COMPLETE ══ -->
<div class="complete-screen" id="complete-screen">
  <div class="complete-emoji" id="complete-emoji">🎉</div>
  <div class="complete-msg" id="complete-msg">동화 끝!</div>
  <div class="complete-sub" id="complete-sub">이제 활동을 시작해볼까요?</div>
  <button class="home-again-btn" onclick="goHome()">다른 동화 보기 🏠</button>
</div>

        text: '"우리도 AI를 만들 수 있을까?" 친구들이 모여 이야기했어요.',
        scene: 'make_wonder'
      },
      {
        text: '"빨간불이면 멈추고, 초록불이면 가는 신호등 알지? 그것도 규칙이야!" 선생님이 말씀하셨어요.',
        scene: 'make_rules'
      },
      {

      },
      {

/* ─── STATE ─────────────────────────────────────────── */
let currentWeek = 0;
let currentPage = 0;
let audioEnabled = true;
let speaking = false;

/* ─── STARS BG ──────────────────────────────────────── */
function createStars() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 3 + 1;
    star.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%;
      left:${Math.random()*100}%;
      animation-delay:${Math.random()*3}s;
      animation-duration:${2+Math.random()*3}s;
    `;
    container.appendChild(star);
  }
}

/* ─── HOME ──────────────────────────────────────────── */
function renderHome() {
  const grid = document.getElementById('weeks-grid');
  grid.innerHTML = WEEKS.map((w, i) => `
    <div class="week-card"
         style="background:linear-gradient(135deg,${w.color[0]},${w.color[1]})"
         onclick="startStory(${i})">
      <div class="wk-emoji">${w.emoji}</div>
      <div class="wk-num">${i+1}주차</div>
      <div class="wk-title">${w.title.replace('\n','<br>')}</div>
    </div>
  `).join('');
}

/* ─── STORY ─────────────────────────────────────────── */
function startStory(weekIndex) {
  currentWeek = weekIndex;
  currentPage = 0;
  const week = WEEKS[weekIndex];

  // set background
  const story = document.getElementById('story');
  story.style.background = `linear-gradient(160deg,${week.color[0]} 0%,${week.color[1]} 100%)`;

  // show story screen
  document.getElementById('home').style.display = 'none';
  story.classList.add('show');

  renderPage();
}

function renderPage() {
  const week = WEEKS[currentWeek];
  const page = week.pages[currentPage];
  const total = week.pages.length;

  // dots
  document.getElementById('page-dots').innerHTML = week.pages.map((_,i) =>
    `<div class="dot ${i===currentPage?'active':''}"></div>`
  ).join('');

  // label
  document.getElementById('story-week-label').textContent =
    `${currentWeek+1}주차 · ${week.title.replace('\n',' ')}`;

  // scene
  document.getElementById('scene-area').innerHTML = buildScene(page.scene, week.color[0]);

  // text (animate in)
  const textEl = document.getElementById('story-text');
  textEl.textContent = '';
  setTimeout(() => {
    textEl.textContent = page.text;
    textEl.style.animation = 'none';
    textEl.offsetHeight;
    textEl.style.animation = '';
  }, 100);

  // next/done button
  const isLast = currentPage === total - 1;
  const nextBtn = document.getElementById('next-btn');
  nextBtn.innerHTML = isLast ? '활동 시작! 🎉' : '다음 →';
  nextBtn.style.color = week.color[1];

  document.getElementById('nav-hint').textContent =
    `${currentPage+1} / ${total}`;

  // audio
  setTimeout(() => speakText(page.text), 400);
}

function nextPage() {
  const week = WEEKS[currentWeek];
  const total = week.pages.length;

  stopSpeech();
  if (currentPage < total - 1) {
    currentPage++;
    renderPage();
  } else {
    showComplete();
  }
}

function goHome() {
  stopSpeech();
  document.getElementById('story').classList.remove('show');
  document.getElementById('complete-screen').classList.remove('show');
  document.getElementById('home').style.display = 'flex';
}

function showComplete() {
  const week = WEEKS[currentWeek];
  document.getElementById('complete-emoji').textContent = week.emoji;
  document.getElementById('complete-msg').textContent = `${week.title.replace('\n','')} 동화 끝!`;
  document.getElementById('complete-screen').classList.add('show');
  speakText('잘 들었어요! 이제 활동을 시작해볼까요?');
}

/* ─── SPEECH ─────────────────────────────────────────── */
function speakText(text) {
  if (!audioEnabled) return;
  stopSpeech();
  if (!window.speechSynthesis) return;
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'ko-KR';
  utt.rate = 0.88;
  utt.pitch = 1.15;
  utt.volume = 1;
  utt.onstart = () => {
    speaking = true;
    document.getElementById('audio-btn').classList.add('playing');
  };
  utt.onend = utt.onerror = () => {
    speaking = false;
    document.getElementById('audio-btn').classList.remove('playing');
  };
  speechSynthesis.speak(utt);
}

function stopSpeech() {
  if (window.speechSynthesis) speechSynthesis.cancel();
  speaking = false;
  const btn = document.getElementById('audio-btn');
  if (btn) btn.classList.remove('playing');
}

function toggleAudio() {
  audioEnabled = !audioEnabled;
  const btn = document.getElementById('audio-btn');
  if (audioEnabled) {
    btn.textContent = '🔊';
    const page = WEEKS[currentWeek]?.pages[currentPage];
    if (page) speakText(page.text);
  } else {
    btn.textContent = '🔇';
    stopSpeech();
  }
}
