<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>노리랩 AI 동화</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { font-family:'Noto Sans KR',sans-serif; background:#1a1a2e; min-height:100vh; overflow:hidden; user-select:none; }

    #home {
      min-height:100vh;
      background:linear-gradient(160deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
      display:flex; flex-direction:column; align-items:center;
      padding:24px 16px 32px; overflow-y:auto;
    }
    .home-title { text-align:center; margin-bottom:28px; margin-top:8px; }
    .home-title .badge {
      display:inline-block; background:rgba(255,255,255,.1);
      border:1px solid rgba(255,255,255,.2); color:rgba(255,255,255,.7);
      font-size:11px; font-weight:700; letter-spacing:.15em;
      padding:4px 14px; border-radius:20px; margin-bottom:10px;
    }
    .home-title h1 { font-size:28px; font-weight:900; color:#fff; line-height:1.2; }
    .home-title h1 span { color:#FFD166; }
    .home-title p { font-size:13px; color:rgba(255,255,255,.5); margin-top:6px; }

    .stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
    .star { position:absolute; background:#fff; border-radius:50%; animation:twinkle 3s infinite; }
    @keyframes twinkle { 0%,100%{opacity:.2;transform:scale(1)} 50%{opacity:.8;transform:scale(1.3)} }

    .weeks-grid {
      display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
      width:100%; max-width:500px; position:relative; z-index:1;
    }
    .week-card {
      border-radius:20px; padding:18px 14px; cursor:pointer;
      transition:transform .2s,box-shadow .2s;
      display:flex; flex-direction:column; align-items:center; gap:8px;
      border:2px solid rgba(255,255,255,.15); position:relative; overflow:hidden;
    }
    .week-card::before { content:''; position:absolute; inset:0; background:rgba(255,255,255,.08); opacity:0; transition:opacity .2s; }
    .week-card:hover::before,.week-card:active::before { opacity:1; }
    .week-card:active { transform:scale(.97); }
    .week-card .wk-emoji { font-size:36px; line-height:1; }
    .week-card .wk-num { font-size:10px; font-weight:700; letter-spacing:.1em; color:rgba(255,255,255,.6); }
    .week-card .wk-title { font-size:13px; font-weight:700; color:#fff; text-align:center; line-height:1.3; }

    #story { display:none; position:fixed; inset:0; flex-direction:column; transition:background .5s; }
    #story.show { display:flex; }

    .story-top {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 18px; position:relative; z-index:10;
    }
    .back-btn {
      width:40px; height:40px; background:rgba(255,255,255,.2); border:none; border-radius:50%;
      color:#fff; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
      backdrop-filter:blur(8px); transition:background .2s;
    }
    .back-btn:hover { background:rgba(255,255,255,.3); }

    .page-dots { display:flex; gap:6px; }
    .dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.3); transition:all .3s; }
    .dot.active { background:#fff; width:20px; border-radius:4px; }

    .audio-btn {
      width:40px; height:40px; background:rgba(255,255,255,.2); border:none; border-radius:50%;
      color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
      backdrop-filter:blur(8px); transition:all .2s;
    }
    .audio-btn:hover { background:rgba(255,255,255,.3); }
    .audio-btn.playing { background:rgba(255,255,255,.4); animation:pulse-btn 1.5s infinite; }
    @keyframes pulse-btn { 0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.4)} 50%{box-shadow:0 0 0 10px rgba(255,255,255,0)} }

    .scene-area { flex:1; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
    .scene-svg { width:100%; max-width:320px; max-height:260px; }
    @keyframes scene-enter { from{opacity:0;transform:translateY(10px) scale(.95)} to{opacity:1;transform:translateY(0) scale(1)} }
    .scene-svg { animation:scene-enter .4s cubic-bezier(.22,1,.36,1); }

    .text-area {
      background:rgba(255,255,255,.15); backdrop-filter:blur(20px);
      border-top:1px solid rgba(255,255,255,.2); padding:22px 22px 14px;
      min-height:160px; display:flex; flex-direction:column; gap:14px;
    }
    .story-week-label { font-size:10px; font-weight:700; letter-spacing:.12em; color:rgba(255,255,255,.5); }
    .story-text { font-size:18px; font-weight:700; color:#fff; line-height:1.65; flex:1; min-height:80px; }

    .story-nav { display:flex; align-items:center; justify-content:space-between; }
    .nav-hint { font-size:11px; color:rgba(255,255,255,.4); font-weight:400; }
    .next-btn {
      padding:10px 22px; background:#fff; border:none; border-radius:24px;
      font-family:'Noto Sans KR',sans-serif; font-size:13px; font-weight:700;
      cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:6px;
    }
    .next-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.2); }
    .next-btn:active { transform:scale(.97); }

    .complete-screen {
      display:none; position:fixed; inset:0;
      background:linear-gradient(135deg,#667eea,#764ba2);
      flex-direction:column; align-items:center; justify-content:center;
      z-index:100; gap:20px; text-align:center; padding:30px;
    }
    .complete-screen.show { display:flex; }
    .complete-emoji { font-size:80px; animation:bounce-up 1s infinite alternate; }
    @keyframes bounce-up { from{transform:translateY(0)} to{transform:translateY(-16px)} }
    .complete-msg { font-size:24px; font-weight:900; color:#fff; line-height:1.3; }
    .complete-sub { font-size:15px; color:rgba(255,255,255,.7); font-weight:400; }
    .home-again-btn {
      margin-top:10px; padding:14px 36px; background:#FFD166;
      border:none; border-radius:30px; font-family:'Noto Sans KR',sans-serif;
      font-size:16px; font-weight:700; color:#333; cursor:pointer; transition:all .2s;
    }
    .home-again-btn:hover { transform:scale(1.04); }

    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes float-sm { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
    @keyframes spin-slow { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes wiggle { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }
    @keyframes hop { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-18px)} 60%{transform:translateY(-16px)} }

    .float { animation:float 2.5s ease-in-out infinite; }
    .float-sm { animation:float-sm 2s ease-in-out infinite; }
    .wiggle { animation:wiggle 0.9s ease-in-out infinite; }
    .spin-slow { animation:spin-slow 8s linear infinite; }
    .hop { animation:hop 0.85s ease-in-out infinite; }

    @media (max-width:400px) {
      .story-text { font-size:16px; }
      .weeks-grid { gap:10px; }
      .week-card { padding:14px 10px; }
    }
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div id="home">
  <div class="home-title" style="position:relative;z-index:1">
    <div class="badge">NORILAB · 노리랩</div>
    <h1>AI <span>동화</span> 극장 🌟</h1>
    <p>주차를 선택하면 동화가 시작돼요!</p>
  </div>
  <div class="weeks-grid" id="weeks-grid"></div>
</div>

<div id="story">
  <div class="story-top">
    <button class="back-btn" onclick="goHome()">←</button>
    <div class="page-dots" id="page-dots"></div>
    <button class="audio-btn" id="audio-btn" onclick="toggleAudio()">🔊</button>
  </div>
  <div class="scene-area" id="scene-area"></div>
  <div class="text-area">
    <div class="story-week-label" id="story-week-label"></div>
    <div class="story-text" id="story-text"></div>
    <div class="story-nav">
      <span class="nav-hint" id="nav-hint">탭하면 다음 장면</span>
      <button class="next-btn" id="next-btn" onclick="nextPage()">다음 <span>→</span></button>
    </div>
  </div>
</div>

<div class="complete-screen" id="complete-screen">
  <div class="complete-emoji" id="complete-emoji">🎉</div>
  <div class="complete-msg" id="complete-msg">동화 끝!</div>
  <div class="complete-sub" id="complete-sub">이제 활동을 시작해볼까요?</div>
  <button class="home-again-btn" onclick="goHome()">다른 동화 보기 🏠</button>
</div>

<script>

      { text:'로봇 친구 뚜루는 처음에는 아무것도 몰랐어요. 사과를 봐도 "이게 뭐지?" 했어요.', scene:'robot_confused' },
      { text:'뚜루는 사과 사진을 100장, 200장, 1000장 보았어요. 그러자 "사과다!" 알 수 있게 됐어요.', scene:'robot_learning' },
      { text:'우리가 책을 읽으며 배우듯이, AI도 많은 것을 보고 들어서 배운답니다.', scene:'robot_smart' },
      { text:'뚜루는 이제 사과도, 바나나도, 포도도 알 수 있어요. 많이 배웠거든요!', scene:'robot_happy' },
    ]
  },
  {
    title:'AI의 눈,\n카메라', emoji:'👀', color:['#FFD166','#F0A500'],
    pages:[
      { text:'별이에게는 특별한 눈이 있어요. 바로 카메라예요! 빛을 모아서 세상을 볼 수 있어요.', scene:'camera_eye' },
      { text:'"별이야, 이게 뭐야?" 꽃을 보여줬더니 "튤립꽃이에요!" 하고 바로 알았어요.', scene:'camera_flower' },
      { text:'고양이를 보면 "야옹이예요!", 강아지를 보면 "강아지예요!" 척척 맞혀요.', scene:'camera_animals' },
      { text:'AI의 카메라 눈은 우리 눈처럼 세상을 보고 무엇인지 알 수 있어요. 신기하지요?', scene:'camera_wow' },
    ]
  },
  {
    title:'AI는 말을\n들어요', emoji:'👂', color:['#06D6A0','#04A07A'],
    pages:[
      { text:'"별이야!" 하고 부르면 별이가 "네, 여기 있어요!" 하고 대답해요.', scene:'ear_call' },
      { text:'별이에게는 아주 작은 귀가 있어요. 우리 말소리를 듣고 글자로 바꿔요.', scene:'ear_listen' },
      { text:'"노래 틀어줘!" 하면 신나는 음악이 나와요. "동화 읽어줘!" 하면 동화를 읽어줘요.', scene:'ear_command' },
      { text:'별이는 우리 말을 잘 듣고 도와주는 친절한 AI 친구예요!', scene:'ear_happy' },
    ]
  },
  {
    title:'AI와 함께\n그림 그려요', emoji:'🎨', color:['#4FC3F7','#0288D1'],
    pages:[
      { text:'"별이야, 하늘을 나는 고양이를 그려줘!" 미소가 말했어요.', scene:'draw_request' },
      { text:'별이가 생각하더니... 짠! 파란 하늘을 나는 줄무늬 고양이 그림이 나타났어요!', scene:'draw_create' },
      { text:'"우와!" 미소가 놀라며 외쳤어요. AI는 우리가 상상하는 것을 그림으로 그려줄 수 있어요.', scene:'draw_wow' },
      { text:'무지개 토끼, 우주 강아지, 꽃 자동차! 뭐든지 그릴 수 있어요. 뭘 그려볼까요?', scene:'draw_ideas' },

  },
  {
    title:'로봇 친구가\n도와줘요', emoji:'🦾', color:['#3D7EFF','#1A56DB'],

      { text:'삐뚜삐뚜! 로봇 친구 뽀뽀가 왔어요. 뽀뽀의 팔은 아주 힘이 세요.', scene:'robot_strong' },

      { text:'AI는 착하게 사용해야 해요. 우리도 AI에게 착한 말을 해야 해요.', scene:'good_rules' },
      { text:'우리가 AI를 바르게 사용하면, AI도 우리에게 더 착한 친구가 돼요!', scene:'good_together' },

  {

    pages:[
      { text:'"우리도 AI를 만들 수 있을까?" 친구들이 모여 이야기했어요.', scene:'make_wonder' },
      { text:'"빨간불이면 멈추고, 초록불이면 가는 신호등 알지? 그것도 규칙이야!" 선생님이 말씀하셨어요.', scene:'make_rules' },
      { text:'AI는 규칙의 모음이에요. 우리가 규칙을 만들면 그게 바로 AI의 시작이에요!', scene:'make_code' },
      { text:'우리는 AI를 사용하는 사람이기도 하고, AI를 만드는 사람이 될 수도 있어요!', scene:'make_future' },

];

let currentWeek = 0, currentPage = 0, audioEnabled = true, speaking = false;

function createStars() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random()*3+1;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s;`;
    c.appendChild(s);
  }
}

function renderHome() {
  document.getElementById('weeks-grid').innerHTML = WEEKS.map((w,i) => `
    <div class="week-card" style="background:linear-gradient(135deg,${w.color[0]},${w.color[1]})" onclick="startStory(${i})">
      <div class="wk-emoji">${w.emoji}</div>
      <div class="wk-num">${i+1}주차</div>
      <div class="wk-title">${w.title.replace('\n','<br>')}</div>
    </div>`).join('');
}

function startStory(weekIndex) {
  currentWeek = weekIndex; currentPage = 0;
  const week = WEEKS[weekIndex];
  document.getElementById('story').style.background = `linear-gradient(160deg,${week.color[0]} 0%,${week.color[1]} 100%)`;
  document.getElementById('home').style.display = 'none';
  document.getElementById('story').classList.add('show');
  renderPage();
}

function renderPage() {
  const week = WEEKS[currentWeek], page = week.pages[currentPage], total = week.pages.length;
  document.getElementById('page-dots').innerHTML = week.pages.map((_,i) => `<div class="dot ${i===currentPage?'active':''}"></div>`).join('');
  document.getElementById('story-week-label').textContent = `${currentWeek+1}주차 · ${week.title.replace('\n',' ')}`;
  document.getElementById('scene-area').innerHTML = buildScene(page.scene, week.color[0]);
  const textEl = document.getElementById('story-text');
  textEl.textContent = '';
  setTimeout(() => { textEl.textContent = page.text; }, 100);
  const isLast = currentPage === total-1;
  const nextBtn = document.getElementById('next-btn');
  nextBtn.innerHTML = isLast ? '활동 시작! 🎉' : '다음 →';
  nextBtn.style.color = week.color[1];
  document.getElementById('nav-hint').textContent = `${currentPage+1} / ${total}`;
  setTimeout(() => speakText(page.text), 400);
}

function nextPage() {
  stopSpeech();
  if (currentPage < WEEKS[currentWeek].pages.length-1) { currentPage++; renderPage(); }
  else showComplete();
}

function goHome() {
  stopSpeech();
  document.getElementById('story').classList.remove('show');
  document.getElementById('complete-screen').classList.remove('show');
  document.getElementById('home').style.display = 'flex';
}

function showComplete() {
  const week = WEEKS[currentWeek];
  document.getElementById('complete-emoji').textContent = week.emoji;
  document.getElementById('complete-msg').textContent = `${week.title.replace('\n','')} 동화 끝!`;
  document.getElementById('complete-screen').classList.add('show');
  speakText('잘 들었어요! 이제 활동을 시작해볼까요?');
}

function speakText(text) {
  if (!audioEnabled || !window.speechSynthesis) return;
  stopSpeech();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'ko-KR'; utt.rate = 0.88; utt.pitch = 1.15; utt.volume = 1;
  utt.onstart = () => { speaking = true; document.getElementById('audio-btn').classList.add('playing'); };
  utt.onend = utt.onerror = () => { speaking = false; document.getElementById('audio-btn').classList.remove('playing'); };
  speechSynthesis.speak(utt);
}

function stopSpeech() {
  if (window.speechSynthesis) speechSynthesis.cancel();
  speaking = false;
  const btn = document.getElementById('audio-btn');
  if (btn) btn.classList.remove('playing');
}

function toggleAudio() {
  audioEnabled = !audioEnabled;
  const btn = document.getElementById('audio-btn');
  if (audioEnabled) {
    btn.textContent = '🔊';
    const page = WEEKS[currentWeek]?.pages[currentPage];
    if (page) speakText(page.text);
  } else {
    btn.textContent = '🔇';
    stopSpeech();
  }
}

/* ────────────────────────────────────────────────────
   CHARACTER BUILDER FUNCTIONS
   SVG animateTransform rotates limbs around explicit pivot points.
   SVG animate morphs eye/mouth attributes for blink & talk.
──────────────────────────────────────────────────── */

/* 별이 (Byeoli) - star-shaped AI character with articulated limbs
   Body centered around (cx, 95). Star polygon tip-to-tip ~140px wide.
   Arm pivots: left (cx-34, 100), right (cx+34, 100)
   Leg pivots: left (cx-12, 122), right (cx+12, 122)            */
function byeoli(cx, opts) {
  cx = cx || 160;
  const o = opts || {};
  const c  = o.color  || '#FFD166';
  const s  = o.stroke || '#F0A500';
  const bc = o.blush  || '#FF9AB0';
  const arm = o.arm   || 'wave_r';  // wave_r, wave_l, wave_both, up, relax, cross
  const mood = o.mood || 'happy';   // happy, talk, neutral

  /* star body polygon centered at (cx, 95), tip at (cx, 57) */
  const px = (dx) => cx + dx;

  /* eyes — blink every ~4s */
  const eyes = `
    <ellipse cx="${px(-9)}" cy="84" rx="4.5" ry="4.5" fill="#2C1810">
      <animate attributeName="ry" values="4.5;4.5;4.5;4.5;0.3;4.5;4.5" dur="3.9s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="${px(-7)}" cy="82" r="1.8" fill="white"/>
    <ellipse cx="${px(9)}" cy="84" rx="4.5" ry="4.5" fill="#2C1810">
      <animate attributeName="ry" values="4.5;4.5;4.5;4.5;0.3;4.5;4.5" dur="3.9s" begin="0.12s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="${px(11)}" cy="82" r="1.8" fill="white"/>`;

  /* mouth */
  const mouthTalk = `<ellipse cx="${px(0)}" cy="96" rx="6.5" ry="3" fill="#C47A00">
      <animate attributeName="ry" values="3;5;3;3;4.5;2;3;4;3" dur="0.5s" repeatCount="indefinite"/>
    </ellipse>`;
  const mouthSmile = `<path d="M${px(-7)} 96 Q${px(0)} 104 ${px(7)} 96" stroke="#C47A00" stroke-width="2.5" fill="rgba(196,122,0,.25)" stroke-linecap="round"/>`;
  const mouth = mood === 'talk' ? mouthTalk : mouthSmile;

  /* blush */
  const blush = `
    <ellipse cx="${px(-18)}" cy="93" rx="6" ry="3.5" fill="${bc}" opacity=".55"/>
    <ellipse cx="${px(18)}" cy="93" rx="6" ry="3.5" fill="${bc}" opacity=".55"/>`;

  /* star polygon: 5 points */
  const star = `<polygon points="${px(0)},57 ${px(10)},83 ${px(38)},83 ${px(16)},100 ${px(24)},126 ${px(0)},110 ${px(-24)},126 ${px(-16)},100 ${px(-38)},83 ${px(-10)},83"
    fill="${c}" stroke="${s}" stroke-width="2.5"/>`;

  /* legs — always walk-kick */
  const legL = `<g>
    <line x1="${px(-12)}" y1="122" x2="${px(-22)}" y2="150" stroke="${s}" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="${px(-24)}" cy="154" rx="7" ry="5" fill="${c}" stroke="${s}" stroke-width="1.5"/>
    <animateTransform attributeName="transform" type="rotate"
      values="-16 ${px(-12)} 122;16 ${px(-12)} 122;-16 ${px(-12)} 122" dur="1.15s" repeatCount="indefinite"/>
  </g>`;
  const legR = `<g>
    <line x1="${px(12)}" y1="122" x2="${px(22)}" y2="150" stroke="${s}" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="${px(24)}" cy="154" rx="7" ry="5" fill="${c}" stroke="${s}" stroke-width="1.5"/>
    <animateTransform attributeName="transform" type="rotate"
      values="16 ${px(12)} 122;-16 ${px(12)} 122;16 ${px(12)} 122" dur="1.15s" repeatCount="indefinite"/>
  </g>`;

  /* arms */
  const makeArm = (side, anim) => {
    const sx = side === 'L' ? px(-34) : px(34);
    const dir = side === 'L' ? -1 : 1;
    /* endpoint relative to pivot */
    let ex, ey, v1, v2;
    if (anim === 'wave') {
      ex = sx + dir*24; ey = 76;
      v1 = `${side==='L'?'35':'-35'} ${sx} 100`; v2 = `${side==='L'?'-18':'18'} ${sx} 100`;
    } else if (anim === 'up') {
      ex = sx + dir*16; ey = 70;
      v1 = `${side==='L'?'25':'-25'} ${sx} 100`; v2 = `${side==='L'?'5':'-5'} ${sx} 100`;
    } else { /* relax */
      ex = sx + dir*20; ey = 118;
      v1 = `${side==='L'?'-12':'12'} ${sx} 100`; v2 = `${side==='L'?'10':'-10'} ${sx} 100`;
    }
    const dur = anim === 'wave' ? '0.72s' : '1.4s';
    return `<g>
      <line x1="${sx}" y1="100" x2="${ex}" y2="${ey}" stroke="${s}" stroke-width="6" stroke-linecap="round"/>
      <circle cx="${ex + (ex>sx?2:-2)}" cy="${ey}" r="7" fill="${c}" stroke="${s}" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="rotate"
        values="${v1};${v2};${v1}" dur="${dur}" repeatCount="indefinite"/>
    </g>`;
  };

  let armL, armR;
  if (arm === 'wave_r')   { armL = makeArm('L','relax'); armR = makeArm('R','wave'); }
  else if (arm === 'wave_l') { armL = makeArm('L','wave'); armR = makeArm('R','relax'); }
  else if (arm === 'wave_both') { armL = makeArm('L','wave'); armR = makeArm('R','wave'); }
  else if (arm === 'up')  { armL = makeArm('L','up'); armR = makeArm('R','up'); }
  else { armL = makeArm('L','relax'); armR = makeArm('R','relax'); }

  /* layer order: legs behind body, body, face, arms in front */
  return `${legL}${legR}${star}${eyes}${mouth}${blush}${armL}${armR}`;
}

/* Robot character — rect body with walking legs and swinging arms
   Head center at (cx, cy). Total height ~190px.
   rc = body color, rs = darker stroke/accent               */
function robo(cx, cy, rc, rs, opts) {
  cx = cx || 160; cy = cy || 85;
  rc = rc || '#FF8C42'; rs = rs || '#E55A00';
  const o = opts || {};
  const ec  = o.eye    || '#00BCD4';  /* eye color */
  const mood = o.mood  || 'happy';
  const legDur = o.fast ? '0.6s' : '0.92s';
  const armDur = o.fast ? '0.6s' : '0.92s';

  /* mouth expression */
  const mouthY = cy + 40;
  let mouthEl;
  if (mood === 'happy') {
    mouthEl = `<path d="M${cx-13} ${mouthY} Q${cx} ${mouthY+10} ${cx+13} ${mouthY}" stroke="${rs}" stroke-width="2.5" fill="rgba(255,180,60,.25)" stroke-linecap="round"/>`;
  } else if (mood === 'talk') {
    mouthEl = `<ellipse cx="${cx}" cy="${mouthY+4}" rx="12" ry="5" fill="${rs}">
      <animate attributeName="ry" values="5;8;5;4;5;7;3;5" dur="0.44s" repeatCount="indefinite"/>
    </ellipse>`;
  } else { /* neutral */
    mouthEl = `<rect x="${cx-12}" y="${mouthY}" width="24" height="6" rx="3" fill="${rs}" opacity=".7"/>`;
  }

  const headY = cy - 10;
  const bodyY = cy + 42;

  /* antenna pulse */
  const ant = `
    <line x1="${cx}" y1="${headY}" x2="${cx}" y2="${headY-22}" stroke="${rs}" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${headY-27}" r="8" fill="#FFD166">
      <animate attributeName="r" values="8;11;8" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.65;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>`;

  /* head */
  const head = `<rect x="${cx-34}" y="${headY}" width="68" height="56" rx="14" fill="${rc}" stroke="${rs}" stroke-width="2.5"/>`;

  /* eyes with blink */
  const eyeEls = `
    <ellipse cx="${cx-16}" cy="${cy+12}" rx="9" ry="9" fill="#1a1a2e"/>
    <ellipse cx="${cx-16}" cy="${cy+12}" rx="6.5" ry="6.5" fill="${ec}">
      <animate attributeName="ry" values="6.5;6.5;6.5;6.5;0.4;6.5;6.5" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="${cx-13}" cy="${cy+9}" r="2.2" fill="white"/>
    <ellipse cx="${cx+16}" cy="${cy+12}" rx="9" ry="9" fill="#1a1a2e"/>
    <ellipse cx="${cx+16}" cy="${cy+12}" rx="6.5" ry="6.5" fill="${ec}">
      <animate attributeName="ry" values="6.5;6.5;6.5;6.5;0.4;6.5;6.5" dur="4s" begin="0.18s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="${cx+19}" cy="${cy+9}" r="2.2" fill="white"/>`;

  /* body */
  const body = `<rect x="${cx-40}" y="${bodyY}" width="80" height="74" rx="14" fill="${rc}" stroke="${rs}" stroke-width="2.5"/>
    <rect x="${cx-24}" y="${bodyY+14}" width="48" height="30" rx="8" fill="rgba(0,0,0,.15)"/>
    <circle cx="${cx-10}" cy="${bodyY+26}" r="6" fill="${ec}" opacity=".8">
      <animate attributeName="r" values="6;7.5;6" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="${cx+10}" cy="${bodyY+26}" r="6" fill="${ec}" opacity=".8">
      <animate attributeName="r" values="6;7.5;6" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>`;

  const lhp = bodyY; /* leg & arm hinge at top of body */
  /* legs */
  const legL = `<g>
    <rect x="${cx-30}" y="${bodyY+74}" width="22" height="30" rx="8" fill="${rs}"/>
    <rect x="${cx-32}" y="${bodyY+100}" width="26" height="12" rx="5" fill="${rs}" opacity=".7"/>
    <animateTransform attributeName="transform" type="rotate"
      values="-18 ${cx-19} ${bodyY+74};18 ${cx-19} ${bodyY+74};-18 ${cx-19} ${bodyY+74}" dur="${legDur}" repeatCount="indefinite"/>
  </g>`;
  const legR = `<g>
    <rect x="${cx+8}" y="${bodyY+74}" width="22" height="30" rx="8" fill="${rs}"/>
    <rect x="${cx+6}" y="${bodyY+100}" width="26" height="12" rx="5" fill="${rs}" opacity=".7"/>
    <animateTransform attributeName="transform" type="rotate"
      values="18 ${cx+19} ${bodyY+74};-18 ${cx+19} ${bodyY+74};18 ${cx+19} ${bodyY+74}" dur="${legDur}" repeatCount="indefinite"/>
  </g>`;

  /* arms */
  const armL = `<g>
    <rect x="${cx-78}" y="${lhp+12}" width="40" height="15" rx="7" fill="${rc}" stroke="${rs}" stroke-width="1.5"/>
    <circle cx="${cx-80}" cy="${lhp+20}" r="11" fill="${rc}" stroke="${rs}" stroke-width="1.5"/>
    <animateTransform attributeName="transform" type="rotate"
      values="22 ${cx-40} ${lhp+20};-22 ${cx-40} ${lhp+20};22 ${cx-40} ${lhp+20}" dur="${armDur}" repeatCount="indefinite"/>
  </g>`;
  const armR = `<g>
    <rect x="${cx+38}" y="${lhp+12}" width="40" height="15" rx="7" fill="${rc}" stroke="${rs}" stroke-width="1.5"/>
    <circle cx="${cx+80}" cy="${lhp+20}" r="11" fill="${rc}" stroke="${rs}" stroke-width="1.5"/>
    <animateTransform attributeName="transform" type="rotate"
      values="-22 ${cx+40} ${lhp+20};22 ${cx+40} ${lhp+20};-22 ${cx+40} ${lhp+20}" dur="${armDur}" repeatCount="indefinite"/>
  </g>`;

  return `${legL}${legR}${body}${ant}${head}${eyeEls}${mouthEl}${armL}${armR}`;
}
